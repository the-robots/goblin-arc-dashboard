<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <title>🧙 Goblin Runner Swarm</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #1a1a1a; color: #d4d4d4; }
    .goblin-card {
      @apply bg-gray-800 text-green-300 border border-green-600 rounded-lg p-4 shadow-lg;
    }
  </style>
</head>
<body class="p-6">
  <h1 class="text-3xl font-bold mb-6">🪄 Goblin Runner Dashboard</h1>
  <div id="pod-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
    <!-- Goblin pods go here -->
  </div>

  <script>
    async function fetchPods() {
      try {
        const res = await fetch('/api/pods');
        const data = await res.json();
        const container = document.getElementById('pod-container');
        container.innerHTML = '';

        data.pods.forEach(pod => {
          const card = document.createElement('div');
          card.className = 'goblin-card';
          card.innerHTML = `
            <h2 class="text-xl font-semibold">🧃 ${pod.name}</h2>
            <p>Status: <span class="text-yellow-300">${pod.status}</span></p>
            <p>Age: ${pod.age}</p>
            <p>Namespace: ${pod.namespace}</p>
          `;
          container.appendChild(card);
        });
      } catch (err) {
        console.error('Goblin error:', err);
      }
    }

    // Fetch initially and every 5 seconds
    fetchPods();
    setInterval(fetchPods, 5000);
  </script>
</body>
</html>
